<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taller 3 - Número Mayor</title>
    <link rel="stylesheet" href="/css/style.css">
    
</head>
<body>

  <header>
        <a href="../index.html">&larr; Volver al inicio</a>
        <h1>Taller 3: Número mayor</h1>
        <p>Desarrolla un programa que permita ingresar tres números y mostrar cuál es el mayor, o avisar si los tres son iguales.</p>
    </header>
<main>
    <form id="formTaller3" novalidate>
        <div>
            <label for="numeroA">Número A</label>
            <input type="number" id="numeroA">
        </div>
        <br>
        <div>
            <label for="numeroB">Número B</label>
            <input type="number" id="numeroB">
        </div>
        <br>
        <div>
            <label for="numeroC">Número C</label>
            <input type="number" id="numeroC">
        </div>
        <br>
        <div class="botones">
                <input type="submit" value="Verificar">
                <input type="reset" value="Limpiar">
        </div>
        
            <p id="resultado" class="mensaje"></p>
            
    </form>
</main>

    <script src="/js/taller3.js"></script>
    
</body>
</html>
